<body bgcolor="#1e1f22">
<table CELLSPACING=0 CELLPADDING=5 COLS=1 WIDTH="100%" BGCOLOR="#606060" >
<tr><td><center>
<font face="Arial, Helvetica" color="#000000">
Dockerfile</font>
</center></td></tr></table>
<pre><span class="s0">FROM </span><span class="s1">eclipse-temurin:21-jre</span>

<span class="s2"># Only copy the fat jar.</span>
<span class="s0">COPY </span><span class="s1">target</span><span class="s0">/*-</span><span class="s1">jar-with-dependencies</span><span class="s3">.</span><span class="s1">jar </span><span class="s0">/</span><span class="s1">app</span><span class="s3">.</span><span class="s1">jar</span>

<span class="s0">EXPOSE </span><span class="s1">5050</span>

<span class="s2"># FIX: You MUST include the email property, or the server will crash on startup.</span>
<span class="s0">ENTRYPOINT </span><span class="s3">[</span><span class="s4">&quot;java&quot;</span><span class="s3">, </span><span class="s4">&quot;-Duser.email=docker@example.com&quot;</span><span class="s3">, </span><span class="s4">&quot;-jar&quot;</span><span class="s3">, </span><span class="s4">&quot;/app.jar&quot;</span><span class="s3">]</span></pre>
</body>
